name: Daily Stock Screener (7:00 PM IST)

on:
  schedule:
    # Runs daily at 13:30 UTC = 7:00 PM IST (19:00 IST)
    - cron: '30 13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Screener & Send Email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
        run: |
          python run_daily_screener.py

      - name: Upload Excel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Final_Breakout_List
          path: Final_Breakout_List.xlsx
